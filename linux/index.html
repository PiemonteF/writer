<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Writer</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="icon" href="/logo.png" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <!-- Visually hidden: actions stay available to assistive tech; UI is keyboard + Commands. -->
      <div class="sr-toolbar" role="toolbar" aria-label="Writer">
        <button type="button" data-action="new">New</button>
        <button type="button" data-action="open">Open</button>
        <button type="button" data-action="save">Save</button>
        <button type="button" data-action="library">Library</button>
        <button type="button" data-action="preview">Preview</button>
        <button type="button" data-action="focus">Focus</button>
        <button type="button" data-action="typewriter">Typewriter</button>
        <button type="button" data-action="night">Night</button>
        <button type="button" data-action="style">Style</button>
        <button type="button" data-action="font">Font</button>
        <button type="button" data-action="commands">Commands</button>
        <span id="doc-title" class="sr-only" aria-live="polite">Untitled</span>
      </div>

      <div class="workspace" id="workspace">
        <aside class="library hidden" id="library" aria-label="Library">
          <input
            class="library-search"
            id="library-search"
            type="search"
            placeholder="Search library"
            aria-label="Search library"
          />
          <ul class="library-list" id="library-list"></ul>
        </aside>
        <section class="editor-pane" aria-label="Editor">
          <div id="editor"></div>
        </section>
        <aside class="preview-pane" id="preview-pane" aria-label="Preview">
          <iframe id="preview" title="Markdown preview" sandbox=""></iframe>
        </aside>
      </div>

      <footer class="stats" id="stats">0 words · 0 min</footer>
    </div>

    <dialog class="commands-dialog" id="commands" aria-labelledby="commands-title">
      <div class="commands-header">
        <h2 id="commands-title">Commands</h2>
        <p class="commands-hint">Filter, ↑↓ to move, Enter to run, Esc to close · Ctrl+/</p>
        <input
          id="commands-search"
          class="commands-search"
          type="search"
          placeholder="Filter commands"
          aria-label="Filter commands"
          autocomplete="off"
        />
      </div>
      <ul id="commands-list" class="commands-list" role="listbox" aria-label="Commands"></ul>
      <p id="commands-empty" class="commands-empty" hidden>No matching commands</p>
    </dialog>
  </body>
</html>
